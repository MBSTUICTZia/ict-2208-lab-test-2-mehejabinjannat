name: GitHub Classroom Workflow
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  autograding:
    name: Autograding
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Compile
        run: javac -d . shapes/Shape.java shapes/Rectangle.java shapes/Circle.java shapes/ShapeMain.java
      - name: Test Rectangle
        run: |
          OUTPUT=$(echo "rectangle Red true 5.0 3.0" | java shapes.ShapeMain)
          EXPECTED="[ shapes.Rectangle ]
Color : Red
Filled: Yes
Width : 5.0
Length: 3.0
Area      : 15.00
Perimeter : 16.00
Area: 15.00
Perimeter: 16.00"
          if [ "$OUTPUT" = "$EXPECTED" ]; then
            echo "✅ Rectangle test passed"
          else
            echo "❌ Rectangle test failed"
            echo "--- Expected ---"
            echo "$EXPECTED"
            echo "--- Got ---"
            echo "$OUTPUT"
            exit 1
          fi
      - name: Test Circle
        run: |
          OUTPUT=$(echo "circle Blue false 7.0" | java shapes.ShapeMain)
          EXPECTED="[ Circle ]
Color : Blue
Filled: No
Radius: 7.0
Area         : 153.94
Circumference: 43.98
Area: 153.94
Perimeter: 43.98"
          if [ "$OUTPUT" = "$EXPECTED" ]; then
            echo "✅ Circle test passed"
          else
            echo "❌ Circle test failed"
            echo "--- Expected ---"
            echo "$EXPECTED"
            echo "--- Got ---"
            echo "$OUTPUT"
            exit 1
          fi
      - name: Run Autograding
        uses: education/autograding@v1
